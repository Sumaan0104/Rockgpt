#side{position:relative;flex:none;width:var(--sw);background:var(--panel);border-right:1px solid var(--line);transition:width .45s var(--out),transform .45s var(--out);overflow:hidden;z-index:30}
#app.drag #side{transition:none}
#app.collapsed #side{width:0;border-color:transparent}
.sin{width:var(--sw);height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 12px) 10px calc(env(safe-area-inset-bottom,0px) + 12px)}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;font-weight:600;letter-spacing:.14em;font-size:15px}
.brand .logo{width:26px}
.btn{display:flex;align-items:center;gap:8px;width:100%;background:none;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:14px;cursor:pointer;transition:background .25s,transform .2s}
.btn:hover{background:var(--hi)}.btn:active{transform:scale(.97)}
#hist{flex:1;overflow-y:auto;margin:14px -4px 0;padding:0 4px}
.hl{font-size:12px;color:var(--muted);padding:6px 8px}
.it{display:flex;align-items:center;gap:6px;padding:10px;border-radius:10px;font-size:14px;cursor:pointer;color:var(--sub);animation:in .4s var(--out) both;transition:.2s}
.it:hover,.it.on{background:var(--hi);color:var(--text)}
.it span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it b{opacity:0;font-weight:400;color:var(--muted);padding:0 4px;transition:.2s}.it:hover b{opacity:1}
@media(hover:none){.it b{opacity:.6}}
@keyframes in{from{opacity:0;transform:translateX(-8px)}}
#rs{position:absolute;top:0;right:0;bottom:0;width:6px;cursor:col-resize;z-index:2;touch-action:none}
#rs:hover,#app.drag #rs{background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--text) 20%,transparent))}
#back{display:none}
.sfoot{padding-top:12px;display:flex;flex-direction:column;gap:8px}
.theme{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:14px;padding:4px 4px 4px 12px;font-size:14px;font-weight:500}
.theme .tl{display:flex;align-items:center;gap:8px}
.seg{display:flex;gap:2px}
.seg button{display:flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);padding:8px 11px;border-radius:11px;font-size:13.5px;cursor:pointer;transition:background .3s,color .3s}
.seg button.on{background:var(--inv);color:var(--invt);font-weight:600}
.auth{display:grid;grid-template-columns:1fr 1.15fr;gap:8px}
.auth button{height:46px;border-radius:14px;font-size:14.5px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:none;transition:transform .2s,background .2s}
.auth button:hover{background:var(--hi)}.auth button.fill{background:var(--inv);color:var(--invt);border-color:transparent}.auth button:active{transform:scale(.96)}
.me{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:14px}
.av{flex:none;width:34px;height:34px;border-radius:50%;background:var(--inv);color:var(--invt);display:grid;place-items:center;font-weight:600}
.me div{flex:1;min-width:0;line-height:1.25;font-size:14px}.me div span,.me small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me small{color:var(--muted);font-size:12px}
.me button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px;padding:6px}.me button:hover{color:var(--text)}

#main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
header{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px}
.ib{width:40px;height:40px;flex:none;border-radius:50%;border:0;background:none;display:grid;place-items:center;cursor:pointer;transition:background .2s,transform .2s,color .2s}
.ib:hover{background:var(--hi)}.ib:active{transform:scale(.9)}
.ib svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
header h1{font-size:17px;font-weight:600;letter-spacing:.14em;margin-right:auto}

/* ===== New chat button (top right) ===== */
.new-top{position:relative;flex:none;height:40px;display:flex;align-items:center;gap:9px;padding:0 15px 0 6px;border:1px solid var(--line);border-radius:999px;background:linear-gradient(180deg,var(--hi),var(--panel));color:var(--text);cursor:pointer;overflow:hidden;font-size:13.5px;font-weight:600;letter-spacing:.02em;transition:transform .3s var(--spring),border-color .25s,box-shadow .3s}

try{const p=JSON.parse(raw);if(p.token){full+=p.token;onChunk(full)}else if(p.error)throw new Error(p.error)}
catch(e){if(raw&&!raw.startsWith("{")&&!raw.endsWith("}")){full+=raw;onChunk(full)}}
}
}
if(buf.trim().startsWith("data:")){
const raw=buf.trim().slice(5).trim();
if(raw&&raw!=="[DONE]"){try{const p=JSON.parse(raw);if(p.token){full+=p.token;onChunk(full)}}catch{}}
}
if(!full){onChunk("I received your message. How can I help you further?")}
}
async function auth(path,body){
if(!CONFIG.AUTH_URL){await sleep(600);return{user:{name:body.name||(body.email||"guest").split("@")[0],email:body.email||"guest@local"}}}
let endpoint=CONFIG.AUTH_URL+"/"+path;
let payload=body;
if(path==="signin"){endpoint=CONFIG.AUTH_URL+"/direct-login";payload={email:body.email,password:body.password}}
else if(path==="signup"){endpoint=CONFIG.AUTH_URL+"/send-otp";payload={email:body.email,type:"signup"}}
else if(path==="verify"){endpoint=CONFIG.AUTH_URL+"/signup";payload={name:body.name,email:body.email,password:body.password,otp:body.code}}
else if(path==="forgot"){endpoint=CONFIG.AUTH_URL+"/send-otp";payload={email:body.email,type:"reset"}}
const r=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},credentials:"include",body:JSON.stringify(payload)});
const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Authentication failed. Please check your credentials.");return j}

function thumb(f,big){
if(f.url&&f.type.startsWith("image/")){const i=document.createElement("img");i.src=f.url;return i}
if(f.url&&f.type.startsWith("video/")){const v=document.createElement("video");v.src=f.url;v.muted=true;v.playsInline=true;if(big)v.controls=true;return v}

const readF=(f,m)=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.onerror=()=>r(null);m==="t"?x.readAsText(f):x.readAsDataURL(f)});
const pack=fs=>Promise.all(fs.map(async o=>{const a={name:o.name,type:o.type};
if(o.file.size<5e6){if(o.type.startsWith("image/"))a.dataUrl=await readF(o.file);else if(/^text|json|javascript/.test(o.type)||/\.(md|csv|py|js|html|css|txt)$/.test(o.name))a.text=await readF(o.file,"t")}return a}));

function fit(){

function userRow(t, fl = [], imm = false){
  const d = document.createElement("div");
  d.className = "msg user";
  if(imm) d.style.animation = "none";
  if(fl && fl.length){
    const a = document.createElement("div");
    a.className = "att";
    fl.forEach(f => a.appendChild(thumb(f, true)));
    d.appendChild(a);
  }
  if(t){
    const b = document.createElement("div");
    b.className = "bub";
    b.textContent = t;
    d.appendChild(b);
  }
  list.appendChild(d);
  return d;
}

function aiRow(done = false){
  const d = document.createElement("div");
  d.className = "msg ai-msg";
  const mk = document.createElement("div");
  mk.className = "ai-mark" + (done ? " done" : " live");
  mk.innerHTML = logo("ai-logo");
  const ct = document.createElement("div");
  ct.className = "ai-content";
  const nm = document.createElement("div");
  nm.className = "ai-name";
  nm.textContent = "ROCKGPT";
  const bd = document.createElement("div");
  bd.className = "body";
  if(!done){
    bd.innerHTML = '<span class="thinking"><i></i><i></i><i></i></span>';
  }
  ct.appendChild(nm);
  ct.appendChild(bd);
  d.appendChild(mk);
  d.appendChild(ct);
  list.appendChild(d);
  return {
    row: d,
    mark: mk,
    body: bd,
    set(t){
      bd.innerHTML = md(t) + '<span class="caret"></span>';
    },
    done(t){
      mk.classList.remove("live");
      mk.classList.add("done");
      if(t !== undefined) bd.innerHTML = md(t);
      else {
        const c = bd.querySelector(".caret"); if(c) c.remove();
        const th = bd.querySelector(".thinking"); if(th) th.remove();
      }
      bd.classList.add("fadein");
    }
  };
}

async function send(){
  if(busy) return;
  const t = input.value.trim();
  if(!t && !pending.length) return;
  const fl = [...pending];
  const packed = await pack(fl);
  pending = [];
  tray.innerHTML = "";
  input.value = "";
  fit();
  empty.classList.add("gone");
  if(!cur){
    cur = { id: Date.now(), title: t.slice(0, 36) || (fl[0] ? fl[0].name : "New Chat"), msgs: [] };
    chats.unshift(cur);
    save();
    renderHist();
  }
  userRow(t, fl);
  cur.msgs.push({ role: "user", content: t, files: fl });
  save();
  toB();
  busy = true;
  const ai = aiRow(false);
  toB();
  try{
    const apiMsgs = cur.msgs.map(m => {
      let content = m.content || "";
      if(m.files && m.files.length){
        m.files.forEach(f => {
          if(f.text) content += "\n\n[Attached File: " + f.name + "]\n" + f.text;
        });
      }
      return { role: m.role, content };
    });
    let ans = "";
    await askRock(apiMsgs, chunk => {
      ans = chunk;
      ai.set(ans);
      if(nearB()) toB();
    });
    ai.done(ans);
    cur.msgs.push({ role: "assistant", content: ans });
    save();
  }catch(err){
    ai.done("I encountered a connection error. Please try again.");
  }finally{
    busy = false;
    fit();
  }
}

document.querySelectorAll(".chip").forEach(b => {
  b.onclick = () => {
    input.value = b.textContent;
    fit();
    send();
  };
});

renderAcct();
renderHist();
fit();
