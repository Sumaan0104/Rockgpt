  <!-- Critical Inline CSS for Frame-0 Paint & Seamless Splash Handoff -->
  <style>
    :root {
      --bg: #000;
      --text: #fff;
      --line: #242424;
      --spring: cubic-bezier(.2, .9, .3, 1.12);
      --out: cubic-bezier(.16, 1, .3, 1);
    }
    [data-theme="light"] {
      --bg: #fff;
      --text: #0a0a0a;
      --line: #dcdcdc;
    }
    html, body {
      background: #000000;
      color: #ffffff;
      margin: 0;
      padding: 0;
    }
    #intro {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      transition: opacity .8s ease, transform .9s var(--out);
      cursor: pointer;
    }
    #intro.done {
      opacity: 0;
      transform: scale(1.08);
      pointer-events: none;
    }
    #intro .il {
      width: min(46vw, 210px);
      overflow: visible;
      animation: ilIn 1.2s var(--out) both;
    }
    .il path {
      fill: var(--text);
      fill-opacity: 0;
      stroke: var(--text);
      stroke-width: 3;
      stroke-linejoin: miter;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: ilDraw 1.6s cubic-bezier(.65, 0, .35, 1) 0.1s forwards, ilFill 0.9s cubic-bezier(.4, 0, .2, 1) 1.5s forwards;
    }
    @keyframes ilIn {
      from { opacity: 0; transform: scale(.9); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes ilDraw {
      to { stroke-dashoffset: 0; }
    }
    @keyframes ilFill {
      to { fill-opacity: 1; stroke-opacity: 0; }
    }
    #word {
      display: flex;
      font-size: clamp(20px, 6vw, 30px);
      font-weight: 500;
      letter-spacing: .42em;
      margin-right: -.42em;
    }
    #word span {
      opacity: 0;
      transform: translateY(60%);
      animation: lt .7s var(--out) forwards;
    }
    @keyframes lt {
      to { opacity: 1; transform: none; }
    }
    #word span:nth-child(1) { animation-delay: 1.80s; }
    #word span:nth-child(2) { animation-delay: 1.88s; }
    #word span:nth-child(3) { animation-delay: 1.96s; }
    #word span:nth-child(4) { animation-delay: 2.04s; }
    #word span:nth-child(5) { animation-delay: 2.12s; }
    #word span:nth-child(6) { animation-delay: 2.20s; }
    #word span:nth-child(7) { animation-delay: 2.28s; }

    .bar {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 46px);
      width: 110px;
      height: 2px;
      background: var(--line);
      overflow: hidden;
      border-radius: 2px;
    }
    .bar::after {
      content: "";
      display: block;
      height: 100%;
      background: var(--text);
      transform: translateX(-100%);
      animation: ld 3.0s cubic-bezier(.65, 0, .35, 1) forwards;
    }
    @keyframes ld {
      to { transform: none; }
    }
    #intro .il, #word span {
      will-change: transform, opacity;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    #intro:not(.go) * {
      animation-play-state: paused !important;
    }
  </style>

  <script>
    (function () {
      var intro = document.getElementById("intro");
      if (!intro) return;

      var done = false;
      var endIntro = function () {
        if (done) return;
        done = true;
        intro.classList.add("done");
        setTimeout(function () {
          if (intro && intro.parentNode) {
            intro.parentNode.removeChild(intro);
          }
        }, 900);
      };

      intro.onclick = endIntro;
      intro.onkeydown = function (e) {
        if (e.key === "Enter" || e.key === " ") endIntro();
      };

      requestAnimationFrame(function () {
        intro.classList.add("go");
        setTimeout(endIntro, 3100);
      });
    })();
  </script>
