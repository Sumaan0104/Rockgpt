<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/rockgpt-mark.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#070709" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RockGPT" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/rockgpt-mark.png" />
    <link rel="preload" as="image" href="/rockgpt-logo.png" />
    <title>RockGPT</title>
  </head>
  <body style="margin: 0; background: #070709; color: white;">
    <div id="root">
      <div style="display: flex; height: 100dvh; width: 100vw; align-items: center; justify-content: center; background: #070709; flex-direction: column; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; user-select: none;">
        <div style="position: relative; display: grid; place-items: center; width: 88px; height: 88px;">
          <img src="/rockgpt-mark.png" alt="RockGPT" width="88" height="88" style="width: 88px; height: 88px; object-fit: contain; filter: drop-shadow(0 0 16px rgba(255,255,255,0.25)); animation: bootGlow 1.8s ease-in-out infinite;" />
        </div>
        <div style="margin-top: 20px; font-weight: 800; font-size: 24px; letter-spacing: 0.22em; color: #ffffff; text-transform: uppercase;">ROCKGPT</div>
        <div style="margin-top: 6px; font-size: 10px; font-family: monospace; letter-spacing: 0.28em; color: #a1a1aa; text-transform: uppercase;">INITIALIZING</div>
      </div>
      <style>
        @keyframes bootGlow {
          0%, 100% { transform: scale(1); opacity: 0.95; filter: drop-shadow(0 0 14px rgba(255,255,255,0.2)); }
          50% { transform: scale(1.02); opacity: 1; filter: drop-shadow(0 0 24px rgba(255,255,255,0.45)); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
