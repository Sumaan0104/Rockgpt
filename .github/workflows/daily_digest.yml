name: RockGPT Daily Engagement Dispatcher

on:
  schedule:
    # 03:30 UTC = 09:00 AM IST (Indian Standard Time, UTC + 05:30)
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      target_email:
        description: 'Target email address (leave empty to dispatch to all registered users)'
        required: false
        default: ''

concurrency:
  group: daily-engagement-dispatcher
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch Daily Engagement Emails
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: rockgpt-backend/package-lock.json

      - name: Install dependencies
        working-directory: rockgpt-backend
        run: npm ci --omit=dev

      - name: Run Daily Digest Dispatcher
        working-directory: rockgpt-backend
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FRONTEND_URL: https://rockgpt-ten.vercel.app
        run: |
          if [ -n "${{ github.event.inputs.target_email }}" ]; then
            echo "Running targeted dispatch for: ${{ github.event.inputs.target_email }}"
            node scripts/dispatch_daily_digest.mjs --email="${{ github.event.inputs.target_email }}"
          else
            echo "Running automated batch dispatch for all registered users"
            node scripts/dispatch_daily_digest.mjs
          fi
